[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nary-lab"
version = "1.0.0"
description = "Compare pairwise, hub-node and hyperedge representations of facts involving more than two things"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24", "scipy>=1.10", "pandas>=2.0",
  "networkx>=3.0", "scikit-learn>=1.3", "pyyaml>=6.0",
]

[project.optional-dependencies]
hypergraph = ["hypergraphx>=1.8"]
viz = ["matplotlib>=3.7"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4", "matplotlib>=3.7", "hypergraphx>=1.8"]

[project.scripts]
nary-lab = "nary_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
